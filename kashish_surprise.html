<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Kashish 💗</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fff0f5, #ffe4ec, #fcecff);
    overflow: hidden;
    color: #5b2940;
  }
  .card {
    width: min(90%, 430px);
    padding: 38px 26px;
    text-align: center;
    background: rgba(255,255,255,.78);
    border-radius: 28px;
    box-shadow: 0 15px 50px rgba(120,50,80,.18);
    backdrop-filter: blur(8px);
    animation: pop .8s ease;
  }
  .heart { font-size: 58px; animation: beat 1.4s infinite; }
  h1 { margin: 10px 0 18px; font-size: 30px; }
  p { font-size: 19px; line-height: 1.6; margin: 10px 0; }
  .small { font-size: 14px; opacity: .7; margin-top: 25px; }
  .reveal {
    margin-top: 25px;
    padding: 13px 20px;
    border: 0;
    border-radius: 999px;
    background: #d94f7d;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }
  #message { display: none; margin-top: 22px; animation: fade .8s ease; }
  .floating {
    position: fixed;
    font-size: 24px;
    animation: float 6s linear infinite;
    opacity: .55;
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes beat { 50% { transform: scale(1.12); } }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes float { from { transform: translateY(110vh) rotate(0); } to { transform: translateY(-15vh) rotate(360deg); } }
</style>
</head>
<body>

<div class="floating" style="left:8%;animation-delay:0s">💗</div>
<div class="floating" style="left:25%;animation-delay:2s">✨</div>
<div class="floating" style="left:72%;animation-delay:1s">🌸</div>
<div class="floating" style="left:88%;animation-delay:3s">🫶🏻</div>

<div class="card">
  <div class="heart">💗</div>
  <h1>Hey Kashish...</h1>
  <p>There’s something I wanted you to know...</p>

  <button class="reveal" onclick="document.getElementById('message').style.display='block'; this.style.display='none';">
    Open this 💌
  </button>

  <div id="message">
    <p><strong>You will always be my best friend, forever. 🫶🏻</strong></p>
    <p>No matter where life takes us,<br>
    I hope our friendship always stays this special. 🌸</p>
    <p>🫂💗✨</p>
    <p class="small">— Someone who’s really lucky to have you</p>
  </div>
</div>

</body>
</html>
